name: Torob Vector release

on:
  push:
    tags:
      - "torob-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        default: "torob-v0.58.0"

permissions:
  contents: read

env:
  CI: true
  DISABLE_MOLD: true
  VECTOR_VERSION: "0.58.0"

jobs:
  # The release is deliberately gated by the CRI-only Kubernetes test.  This
  # job has no API credentials and uses containerd in Minikube.
  kubernetes-e2e:
    name: Kubernetes CRI filesystem source E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build-linux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vector-${{ env.VECTOR_VERSION }}-x86_64-unknown-linux-gnu
          path: target/artifacts
      - name: Install Minikube and kubectl
        run: |
          curl -fsSL https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 -o /tmp/minikube
          sudo install /tmp/minikube /usr/local/bin/minikube
          curl -fsSL https://dl.k8s.io/release/stable.txt -o /tmp/k8s-version
          curl -fsSL "https://dl.k8s.io/release/$(cat /tmp/k8s-version)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: Run Minikube containerd E2E without Kubernetes credentials
        env:
          VECTOR_DEB: ${{ github.workspace }}/target/artifacts/vector_${{ env.VECTOR_VERSION }}-1_amd64.deb
          CONTAINER_RUNTIME: containerd
        run: scripts/test-e2e-kubernetes-logs-fs.sh

  build-linux:
    name: Build ${{ matrix.target }} packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-musleabi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
        with:
          rust: true
          cross: true
          cargo-deb: true
          protoc: true
          libsasl2: true
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y cmark-gfm rpm
      - name: Build archive and native packages
        env:
          VERSION: ${{ env.VECTOR_VERSION }}
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
          NATIVE: "false"
        run: |
          make package-${{ matrix.target }}
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) make package-deb-x86_64-unknown-linux-gnu ;;
            aarch64-unknown-linux-gnu) make package-deb-aarch64 ;;
            armv7-unknown-linux-gnueabihf) make package-deb-armv7-gnu ;;
            arm-unknown-linux-gnueabi) make package-deb-arm-gnu ;;
          esac
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" || "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu) make package-rpm-x86_64-unknown-linux-gnu ;;
              aarch64-unknown-linux-gnu) make package-rpm-aarch64 ;;
              armv7-unknown-linux-gnueabihf) make package-rpm-armv7hl-gnu ;;
            esac
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-${{ env.VECTOR_VERSION }}-${{ matrix.target }}
          path: target/artifacts/vector*
          if-no-files-found: error

  checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-24.04
    needs: [build-linux]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Generate checksums
        env:
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
        run: make sha256sum
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-${{ env.VECTOR_VERSION }}-SHA256SUMS
          path: target/artifacts/vector-${{ env.VECTOR_VERSION }}-SHA256SUMS

  docker-images:
    name: Build and smoke-test Docker images
    runs-on: ubuntu-24.04
    needs: [kubernetes-e2e, build-linux]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Build and smoke-test retained Dockerfiles
        env:
          VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for flavor in alpine debian distroless-libc distroless-static; do
            image="torob/vector:${VERSION}-${flavor}"
            docker build --pull --file "distribution/docker/${flavor}/Dockerfile" --tag "$image" target/artifacts
            docker run --rm "$image" --version
            docker run --rm "$image" --config /usr/share/vector/examples/vector.yaml validate --no-environment
          done
      - name: Push images only with explicit registry configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin
          for flavor in alpine debian distroless-libc distroless-static; do
            local_image="torob/vector:${VERSION}-${flavor}"
            remote_image="${REGISTRY}/torob/vector:${VERSION}-${flavor}"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
          done
          gh api --method PATCH "/user/packages/container/vector" \
            -f visibility=public

  github-release:
    name: Publish binary GitHub Release
    runs-on: ubuntu-24.04
    needs: [kubernetes-e2e, build-linux, checksums, docker-images]
    if: >-
      ${{
        always() &&
        needs.kubernetes-e2e.result == 'success' &&
        needs.build-linux.result == 'success' &&
        needs.checksums.result == 'success' &&
        needs.docker-images.result == 'success'
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Publish upstream-compatible binary artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag || github.ref_name }}" target/artifacts/vector* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Vector ${VECTOR_VERSION}" \
            --generate-notes
