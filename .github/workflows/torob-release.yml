name: Torob Vector release

on:
  push:
    tags:
      - "torob-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        default: "torob-v0.58.0"

permissions:
  contents: read

env:
  CI: true
  DISABLE_MOLD: true
  VECTOR_VERSION: "0.58.0"

jobs:
  build-linux:
    name: Build ${{ matrix.target }} packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
        with:
          rust: true
          cross: true
          cargo-deb: true
          protoc: true
          libsasl2: true
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y cmark-gfm rpm
      - name: Build archive and native packages
        env:
          VERSION: ${{ env.VECTOR_VERSION }}
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
          NATIVE: "false"
        run: |
          make package-${{ matrix.target }}
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) make package-deb-x86_64-unknown-linux-gnu ;;
          esac
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu) make package-rpm-x86_64-unknown-linux-gnu ;;
            esac
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-${{ env.VECTOR_VERSION }}-${{ matrix.target }}
          path: target/artifacts/vector*
          if-no-files-found: error

  checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-24.04
    needs: [build-linux]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Generate checksums
        env:
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
        run: make sha256sum
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-${{ env.VECTOR_VERSION }}-SHA256SUMS
          path: target/artifacts/vector-${{ env.VECTOR_VERSION }}-SHA256SUMS

  docker-images:
    name: Build and publish Docker images
    runs-on: ubuntu-24.04
    needs: [build-linux]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Build retained Dockerfiles
        env:
          VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for flavor in alpine debian distroless-libc distroless-static; do
            image="torob/vector:${VERSION}-${flavor}"
            docker build --pull --file "distribution/docker/${flavor}/Dockerfile" --tag "$image" target/artifacts
          done
      - name: Push images only with explicit registry configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin
          for flavor in alpine debian distroless-libc distroless-static; do
            local_image="torob/vector:${VERSION}-${flavor}"
            remote_image="${REGISTRY}/torob/vector:${VERSION}-${flavor}"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
          done
          gh api --method PATCH "/user/packages/container/vector" \
            -f visibility=public

  github-release:
    name: Publish binary GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-linux, checksums]
    if: >-
      ${{
        always() &&
        needs.build-linux.result == 'success' &&
        needs.checksums.result == 'success'
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vector-${{ env.VECTOR_VERSION }}-*
          path: target/artifacts
          merge-multiple: true
      - name: Publish upstream-compatible binary artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTOR_VERSION: ${{ env.VECTOR_VERSION }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag || github.ref_name }}" target/artifacts/vector* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Vector ${VECTOR_VERSION}" \
            --generate-notes
